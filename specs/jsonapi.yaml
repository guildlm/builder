name: jsonapi
language: go
go_module: guildlm.dev/jsonapi
description: >-
  A small, idiomatic, STANDARD-LIBRARY-ONLY JSON HTTP endpoint. No external
  dependencies — use encoding/json and net/http only. All files use package
  main.
files:
  - path: go.mod
    purpose: >-
      Go module file. Module path guildlm.dev/jsonapi, go 1.23. No dependencies.
      Output as a ```mod block, not Go.
  - path: main.go
    purpose: >-
      package main. POST /echo accepts a JSON body {"message": string} and
      responds with JSON {"echo": <message>, "length": <len of message>} and
      Content-Type application/json. Return 405 for non-POST, 400 for invalid
      JSON or an empty message, 200 on success. Expose newMux() *http.ServeMux so
      tests can drive it. Standard library only (encoding/json, net/http).
  - path: main_test.go
    purpose: >-
      package main. TestContentTypeJSON: POST a valid message and assert the
      RESPONSE header Content-Type is exactly "application/json" — read it with
      res.Header.Get("Content-Type").
      TestWireFieldNames: the JSON KEY NAMES are the contract, and a test that
      marshals its request from echoRequest and decodes its response into
      echoResponse cannot see them — both sides go through the same struct tags, so
      renaming a tag renames it in the test too and everything still passes while a
      real client breaks. So: POST the RAW STRING `{"message":"hi"}` (do NOT
      json.Marshal a struct), read the response body as a STRING, and decode it into
      a map[string]any. Then assert THREE separate things, each on its own line —
      len(m) == 2 is NOT enough on its own, because renaming a key leaves the count
      unchanged: (a) m["echo"] == "hi", (b) the key "length" is PRESENT, checked with
      the comma-ok form `if _, ok := m["length"]; !ok { t.Errorf(...) }`, and (c)
      len(m) == 2. Never decode this one into echoResponse.
      TestInvalidJSON: POST /echo with a body that is NOT valid
      JSON — send the raw bytes `{"message":` (truncated ON PURPOSE; do NOT send
      `{}` or `{"message":""}`, which are valid JSON and take the empty-message
      branch that is already covered) -> 400.
      SIX test functions in this file, all of them: TestContentTypeJSON,
      TestWireFieldNames and TestInvalidJSON above, and these three —
      TestValidMessage: POST a valid message -> 200 with the echoed message and the
      correct length; on that SAME success response `res`, ALSO assert the RESPONSE
      header res.Header.Get("Content-Type") == "application/json" (the response's own
      Content-Type, not the request's).
      TestEmptyMessage: POST an empty message -> 400.
      TestNonPOSTMethod: a GET /echo (non-POST) -> 405.
      Build the handler with newMux(). Standard library only.
